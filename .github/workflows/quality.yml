name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dairycare_test
          MYSQL_USER: dairycare
          MYSQL_PASSWORD: dairycare-test-password
          MYSQL_ROOT_PASSWORD: dairycare-root-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, pdo_mysql, pdo_sqlite
          coverage: none
      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: php artisan test --colors=never
      - run: php artisan route:list --path=api/v1 --except-vendor
      - name: Validate MySQL migration, rollback, seed, and tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: dairycare_test
          DB_USERNAME: dairycare
          DB_PASSWORD: dairycare-test-password
          DAIRYCARE_SEED_PASSWORD: ci-only-seed-password
        run: php artisan migrate:fresh --force && php artisan migrate:rollback --force && php artisan migrate --force && php artisan db:seed --force && php artisan migrate:fresh --force && php artisan test --colors=never
      - run: composer audit --locked --no-interaction

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: dart format lib test --output=none --set-exit-if-changed
      - run: flutter analyze
      - run: flutter test --concurrency=1
      - run: flutter build apk --debug --dart-define=APP_ENV=development --dart-define=API_BASE_URL=http://10.0.2.2:8000/api/v1
      - run: flutter build web --release --dart-define=APP_ENV=production --dart-define=API_BASE_URL=https://api.example.invalid/api/v1
