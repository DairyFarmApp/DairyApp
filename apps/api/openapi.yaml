openapi: 3.1.0
info:
  title: DairyCare API
  version: 3.1.0-daily-milk-production
  description: Foundation, animal management, owner/family access, ledger-backed inventory, and tenant-safe daily milk production with offline idempotency and immutable corrections.
servers:
  - url: http://127.0.0.1:8000/api/v1
security:
  - opaqueSession: []
paths:
  /auth/login:
    post:
      security: []
      summary: Sign in and create an opaque session
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200': { $ref: '#/components/responses/SessionResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
        '429': { $ref: '#/components/responses/ErrorResponse' }
  /auth/renew:
    post:
      security: []
      summary: Rotate a session renewal credential
      operationId: renewSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [renewal_credential]
              properties:
                renewal_credential: { type: string }
      responses:
        '200': { $ref: '#/components/responses/SessionResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /auth/owner-signup:
    post:
      security: []
      summary: Create a private single-farm account and its primary owner
      operationId: signupPrimaryOwner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerSignupRequest' }
      responses:
        '201': { $ref: '#/components/responses/SessionResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
        '429': { $ref: '#/components/responses/ErrorResponse' }
  /auth/family-invite/inspect:
    post:
      security: []
      summary: Validate a reusable family invitation without consuming it
      operationId: inspectFamilyInvite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FamilyInviteToken' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
        '429': { $ref: '#/components/responses/ErrorResponse' }
  /auth/family-signup:
    post:
      security: []
      summary: Create a persistent family account through a reusable farm invitation
      operationId: signupFamilyAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FamilySignupRequest' }
      responses:
        '201': { $ref: '#/components/responses/SessionResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
        '429': { $ref: '#/components/responses/ErrorResponse' }
  /auth/logout:
    post:
      summary: Sign out the current session
      operationId: logout
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
  /auth/me:
    get:
      summary: Read the current user and active tenant context
      operationId: currentUser
      responses:
        '200': { $ref: '#/components/responses/SessionResponse' }
  /auth/profile:
    get:
      summary: Read the current user's editable profile
      operationId: getProfile
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
    patch:
      summary: Update the current user's name, phone number, or email
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /auth/profile/photo:
    get:
      summary: Download the current user's profile picture
      operationId: getProfilePhoto
      responses:
        '200':
          description: Profile picture bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/ErrorResponse' }
    post:
      summary: Upload or replace the current user's profile picture
      operationId: uploadProfilePhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
    delete:
      summary: Remove the current user's profile picture
      operationId: deleteProfilePhoto
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
  /auth/sessions:
    get:
      summary: List the current user's sessions
      operationId: listSessions
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
  /auth/sessions/{session}:
    delete:
      summary: Revoke one of the current user's sessions
      operationId: revokeSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /auth/switch-organization:
    post:
      summary: Switch the active organization
      operationId: switchOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id]
              properties:
                organization_id: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200': { $ref: '#/components/responses/SessionResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
  /auth/switch-farm:
    post:
      summary: Switch the active farm
      operationId: switchFarm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [farm_id]
              properties:
                farm_id: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200': { $ref: '#/components/responses/SessionResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
  /family-invite:
    get:
      summary: Read the primary owner's reusable family invitation
      operationId: getFamilyInvite
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
    post:
      summary: Create or regenerate the reusable family invitation
      operationId: rotateFamilyInvite
      responses:
        '201': { $ref: '#/components/responses/SuccessResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
    delete:
      summary: Disable the reusable family invitation
      operationId: disableFamilyInvite
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /family-members:
    get:
      summary: List active and removed family accounts
      operationId: listFamilyMembers
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
  /family-members/{membership}:
    parameters:
      - $ref: '#/components/parameters/MembershipId'
    delete:
      summary: Remove a family account and revoke its active farm sessions
      operationId: removeFamilyMember
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
  /family-members/{membership}/restore:
    parameters:
      - $ref: '#/components/parameters/MembershipId'
    post:
      summary: Restore a previously removed family account
      operationId: restoreFamilyMember
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
  /profile-photos/{user}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      summary: Download an active member's profile picture within the current farm account
      operationId: getMemberProfilePhoto
      responses:
        '200':
          description: Profile picture bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /organizations:
    get:
      summary: List authorized organizations
      operationId: listOrganizations
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
  /organizations/{organization}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      summary: Read an authorized organization
      operationId: getOrganization
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
    patch:
      summary: Update an organization
      operationId: updateOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationPatch' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
  /farms:
    get:
      summary: List authorized farms
      operationId: listFarms
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
    post:
      summary: Create a farm
      operationId: createFarm
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FarmWrite' }
      responses:
        '201': { $ref: '#/components/responses/SuccessResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
  /farms/{farm}:
    parameters:
      - $ref: '#/components/parameters/FarmId'
    get:
      summary: Read an authorized farm
      operationId: getFarm
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
    patch:
      summary: Update an authorized farm
      operationId: updateFarm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FarmWrite' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
    delete:
      summary: Archive an authorized farm
      operationId: archiveFarm
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
  /farms/{farm}/sheds:
    parameters:
      - $ref: '#/components/parameters/FarmId'
    get:
      summary: List sheds in an authorized farm
      operationId: listSheds
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
    post:
      summary: Create a shed in an authorized farm
      operationId: createShed
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShedWrite' }
      responses:
        '201': { $ref: '#/components/responses/SuccessResponse' }
  /sheds/{shed}:
    parameters:
      - $ref: '#/components/parameters/ShedId'
    get:
      summary: Read an authorized shed
      operationId: getShed
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
    patch:
      summary: Update an authorized shed
      operationId: updateShed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShedWrite' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
    delete:
      summary: Archive an authorized shed
      operationId: archiveShed
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
  /animal-species:
    get:
      summary: List controlled animal species
      operationId: listAnimalSpecies
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
  /animal-breeds:
    get:
      summary: List organization animal breeds
      operationId: listAnimalBreeds
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/ArchiveState'
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
    post:
      summary: Create an organization animal breed
      operationId: createAnimalBreed
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnimalBreedCreate' }
      responses:
        '201': { $ref: '#/components/responses/SuccessResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /animal-breeds/{breed}:
    parameters:
      - $ref: '#/components/parameters/BreedId'
    get:
      summary: Read an organization animal breed
      operationId: getAnimalBreed
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
    patch:
      summary: Update an organization animal breed
      operationId: updateAnimalBreed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnimalBreedUpdate' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '412': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
    delete:
      summary: Archive an organization animal breed
      operationId: archiveAnimalBreed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionedMutation' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '412': { $ref: '#/components/responses/ErrorResponse' }
  /animal-groups:
    get:
      summary: List authorized farm animal groups
      operationId: listAnimalGroups
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/ArchiveState'
        - name: 'filter[farm_id]'
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
    post:
      summary: Create an animal group in an authorized farm
      operationId: createAnimalGroup
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnimalGroupCreate' }
      responses:
        '201': { $ref: '#/components/responses/SuccessResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /animal-groups/{group}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      summary: Read an authorized animal group
      operationId: getAnimalGroup
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
    patch:
      summary: Update an authorized animal group
      operationId: updateAnimalGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnimalGroupUpdate' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '412': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
    delete:
      summary: Archive an authorized animal group
      operationId: archiveAnimalGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionedMutation' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '412': { $ref: '#/components/responses/ErrorResponse' }
  /animals:
    get:
      summary: Search and filter authorized animals
      operationId: listAnimals
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/ArchiveState'
        - name: 'filter[search]'
          in: query
          schema: { type: string, maxLength: 120 }
        - name: 'filter[species_id]'
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: 'filter[breed_id]'
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: 'filter[sex]'
          in: query
          schema: { $ref: '#/components/schemas/AnimalSex' }
        - name: 'filter[life_stage]'
          in: query
          schema: { $ref: '#/components/schemas/AnimalLifeStage' }
        - name: 'filter[farm_id]'
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: 'filter[shed_id]'
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: 'filter[group_id]'
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: 'filter[operational_status]'
          in: query
          schema: { $ref: '#/components/schemas/AnimalOperationalStatus' }
        - name: sort
          in: query
          schema:
            type: string
            enum: [animal_number, -animal_number, name, -name, date_of_birth, -date_of_birth, created_at, -created_at]
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
    post:
      summary: Register an animal in an authorized farm
      operationId: createAnimal
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnimalCreate' }
      responses:
        '201': { $ref: '#/components/responses/SuccessResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /animals/{animal}:
    parameters:
      - $ref: '#/components/parameters/AnimalId'
    get:
      summary: Read an authorized animal profile
      operationId: getAnimal
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
    patch:
      summary: Update permitted fields on an animal profile
      operationId: updateAnimal
      description: Location fields are prohibited; post-registration location changes belong to the movement workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnimalUpdate' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '412': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
    delete:
      summary: Archive an authorized animal
      operationId: archiveAnimal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionedMutation' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '412': { $ref: '#/components/responses/ErrorResponse' }
  /animals/{animal}/restore:
    parameters:
      - $ref: '#/components/parameters/AnimalId'
    post:
      summary: Restore an authorized archived animal
      operationId: restoreAnimal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionedMutation' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '412': { $ref: '#/components/responses/ErrorResponse' }
  /animals/{animal}/movements:
    parameters:
      - $ref: '#/components/parameters/AnimalId'
    get:
      summary: List authorized movement history for an animal
      operationId: listAnimalMovements
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - name: 'filter[status]'
          in: query
          schema: { $ref: '#/components/schemas/AnimalMovementStatus' }
        - name: 'filter[search]'
          in: query
          schema: { type: string, maxLength: 120 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [requested_effective_at, -requested_effective_at, created_at, -created_at]
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
    post:
      summary: Request an online animal location movement
      operationId: requestAnimalMovement
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnimalMovementCreate' }
      responses:
        '201': { $ref: '#/components/responses/SuccessResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /animals/{animal}/weights:
    parameters:
      - $ref: '#/components/parameters/AnimalId'
    get:
      summary: List authorized weight history for an animal
      operationId: listAnimalWeights
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
        - name: sort
          in: query
          schema:
            type: string
            enum: [observed_at, -observed_at, created_at, -created_at]
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
    post:
      summary: Record an online animal weight
      operationId: recordAnimalWeight
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnimalWeightCreate' }
      responses:
        '201': { $ref: '#/components/responses/SuccessResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /animals/{animal}/status-history:
    parameters:
      - $ref: '#/components/parameters/AnimalId'
    get:
      summary: List authorized operational-status history for an animal
      operationId: listAnimalStatusHistory
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /animals/{animal}/status-changes:
    parameters:
      - $ref: '#/components/parameters/AnimalId'
    post:
      summary: Change and atomically project an animal operational status
      operationId: changeAnimalStatus
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnimalStatusChangeCreate' }
      responses:
        '201': { $ref: '#/components/responses/SuccessResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '412': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /animal-movements/{movement}:
    parameters:
      - $ref: '#/components/parameters/AnimalMovementId'
    get:
      summary: Read one authorized animal movement
      operationId: getAnimalMovement
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /animal-movements/{movement}/approve:
    parameters:
      - $ref: '#/components/parameters/AnimalMovementId'
    post:
      summary: Approve and atomically apply a pending animal movement
      operationId: approveAnimalMovement
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnimalMovementDecision' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '412': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /animal-movements/{movement}/reject:
    parameters:
      - $ref: '#/components/parameters/AnimalMovementId'
    post:
      summary: Reject a pending animal movement
      operationId: rejectAnimalMovement
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnimalMovementReasonDecision' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '412': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /animal-movements/{movement}/cancel:
    parameters:
      - $ref: '#/components/parameters/AnimalMovementId'
    post:
      summary: Cancel a pending animal movement
      operationId: cancelAnimalMovement
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnimalMovementReasonDecision' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '412': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /animal-weights/{weight}:
    parameters:
      - $ref: '#/components/parameters/AnimalWeightId'
    get:
      summary: Read one authorized animal weight record
      operationId: getAnimalWeight
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /animal-weights/{weight}/correct:
    parameters:
      - $ref: '#/components/parameters/AnimalWeightId'
    post:
      summary: Supersede an immutable weight record with a linked correction
      operationId: correctAnimalWeight
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnimalWeightCorrection' }
      responses:
        '201': { $ref: '#/components/responses/SuccessResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /inventory:
    get:
      summary: Read medicine, semen, and feed inventory summaries for the active farm
      operationId: inventoryDashboard
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
  /inventory/{kind}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { $ref: '#/components/schemas/InventoryKind' }
    get:
      summary: Search and filter one inventory type with its stock overview
      operationId: inventoryOverview
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string, maxLength: 180 }
        - name: category
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
        - name: supplier
          in: query
          required: false
          schema: { type: string, maxLength: 180 }
        - name: low_stock
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /inventory/{kind}/exports/receipt:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { $ref: '#/components/schemas/InventoryKind' }
    get:
      summary: Download a PDF receipt for selected or all filtered inventory items and movement dates
      operationId: exportInventoryReceipt
      parameters:
        - $ref: '#/components/parameters/InventoryItemIds'
        - $ref: '#/components/parameters/InventoryFromDate'
        - $ref: '#/components/parameters/InventoryToDate'
      responses:
        '200':
          description: PDF inventory receipt
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /inventory/{kind}/exports/spreadsheet:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { $ref: '#/components/schemas/InventoryKind' }
    get:
      summary: Download a two-sheet Excel workbook for selected or all filtered inventory items and movement dates
      operationId: exportInventorySpreadsheet
      parameters:
        - $ref: '#/components/parameters/InventoryItemIds'
        - $ref: '#/components/parameters/InventoryFromDate'
        - $ref: '#/components/parameters/InventoryToDate'
      responses:
        '200':
          description: XLSX inventory workbook
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /inventory/{kind}/items:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { $ref: '#/components/schemas/InventoryKind' }
    post:
      summary: Create an inventory item, first batch, and opening-stock movement
      operationId: createInventoryItem
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryItemCreate' }
      responses:
        '201': { $ref: '#/components/responses/SuccessResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /inventory/{kind}/items/{item}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { $ref: '#/components/schemas/InventoryKind' }
      - name: item
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    patch:
      summary: Update inventory item metadata without changing stock directly
      operationId: updateInventoryItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryItemUpdate' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '412': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
    delete:
      summary: Archive a zero-stock inventory item while retaining all batch and movement history
      operationId: archiveInventoryItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '412': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /inventory/{kind}/items/{item}/receipts:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { $ref: '#/components/schemas/InventoryKind' }
      - name: item
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    post:
      summary: Receive a batch and append a purchase-receipt stock movement
      operationId: receiveInventoryStock
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryReceipt' }
      responses:
        '201': { $ref: '#/components/responses/SuccessResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /inventory/{kind}/items/{item}/movements:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { $ref: '#/components/schemas/InventoryKind' }
      - name: item
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    get:
      summary: Read the immutable stock ledger for an inventory item
      operationId: inventoryStockMovements
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /milk/daily:
    get:
      summary: Load eligible animals, entries, and calculated daily milk totals
      operationId: getDailyMilkProduction
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: session
          in: query
          required: false
          schema: { $ref: '#/components/schemas/MilkingSession' }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /milk/entries/bulk:
    post:
      summary: Record one session of milk for one or more eligible animals
      operationId: recordDailyMilkEntries
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MilkBulkCreate' }
      responses:
        '201': { $ref: '#/components/responses/SuccessResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /milk/entries/{entry}/correct:
    post:
      summary: Append a corrected milk-entry revision while preserving the original
      operationId: correctMilkEntry
      parameters:
        - name: entry
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MilkCorrection' }
      responses:
        '201': { $ref: '#/components/responses/SuccessResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /sync/bootstrap:
    get:
      summary: Bootstrap authorized reference data
      operationId: syncBootstrap
      responses:
        '200': { $ref: '#/components/responses/SyncResponse' }
  /sync/changes:
    get:
      summary: Pull authorized incremental reference changes
      operationId: syncChanges
      parameters:
        - name: cursor
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/SyncResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
components:
  securitySchemes:
    opaqueSession:
      type: http
      scheme: bearer
      bearerFormat: Opaque
  parameters:
    SessionId: { name: session, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    OrganizationId: { name: organization, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    FarmId: { name: farm, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ShedId: { name: shed, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    BreedId: { name: breed, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    GroupId: { name: group, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    AnimalId: { name: animal, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    AnimalMovementId: { name: movement, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    AnimalWeightId: { name: weight, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    MembershipId: { name: membership, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    UserId: { name: user, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 160 } }
    PageSize: { name: 'page[size]', in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    PageNumber: { name: 'page[page]', in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
    ArchiveState: { name: 'filter[archive_state]', in: query, required: false, schema: { type: string, enum: [active, archived, all], default: active } }
    InventoryItemIds:
      name: item_ids
      in: query
      required: false
      description: One to 200 active inventory item UUIDs. Omit to include every active item of the selected kind in the active farm.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 200
        uniqueItems: true
        items: { $ref: '#/components/schemas/Uuid' }
    InventoryFromDate:
      name: from_date
      in: query
      required: false
      description: Inclusive stock-movement date in the active farm timezone.
      schema: { type: string, format: date }
    InventoryToDate:
      name: to_date
      in: query
      required: false
      description: Inclusive stock-movement date in the active farm timezone.
      schema: { type: string, format: date }
  schemas:
    Uuid: { type: string, format: uuid }
    AnimalSex: { type: string, enum: [female, male] }
    AnimalLifeStage: { type: string, enum: [calf, juvenile, adult] }
    AnimalOperationalStatus: { type: string, enum: [active, inactive, missing] }
    AnimalOrigin: { type: string, enum: [born_on_farm, purchased, transferred_in, other] }
    AnimalMovementStatus: { type: string, enum: [pending, approved, rejected, cancelled] }
    AnimalWeightUnit: { type: string, enum: [kg, lb] }
    AnimalWeightSource: { type: string, enum: [manual, scale, estimated, imported] }
    InventoryKind: { type: string, enum: [medicine, semen, feed] }
    MilkingSession: { type: string, enum: [morning, afternoon, evening] }
    VersionRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
    InventoryItemCreate:
      type: object
      required: [farm_id, name, category, unit, minimum_stock, batch_number, opening_quantity, unit_cost]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        farm_id: { $ref: '#/components/schemas/Uuid' }
        item_code: { type: [string, 'null'], maxLength: 60 }
        barcode: { type: [string, 'null'], maxLength: 120 }
        name: { type: string, maxLength: 180 }
        category: { type: string, maxLength: 100 }
        brand: { type: [string, 'null'], maxLength: 160 }
        unit: { type: string, maxLength: 40 }
        minimum_stock: { type: string, pattern: '^\d{1,14}(?:\.\d{1,3})?$' }
        maximum_stock: { type: [string, 'null'], pattern: '^\d{1,14}(?:\.\d{1,3})?$' }
        notes: { type: [string, 'null'], maxLength: 5000 }
        batch_number: { type: string, maxLength: 120 }
        supplier: { type: [string, 'null'], maxLength: 180 }
        purchase_date: { type: [string, 'null'], format: date }
        expiry_date: { type: [string, 'null'], format: date }
        opening_quantity: { type: string, pattern: '^\d{1,14}(?:\.\d{1,3})?$' }
        unit_cost: { type: string, pattern: '^\d{1,14}(?:\.\d{1,4})?$' }
    InventoryItemUpdate:
      type: object
      required: [name, category, unit, minimum_stock, version]
      properties:
        name: { type: string, maxLength: 180 }
        category: { type: string, maxLength: 100 }
        barcode: { type: [string, 'null'], maxLength: 120 }
        brand: { type: [string, 'null'], maxLength: 160 }
        unit: { type: string, maxLength: 40 }
        minimum_stock: { type: string }
        maximum_stock: { type: [string, 'null'] }
        notes: { type: [string, 'null'], maxLength: 5000 }
        version: { type: integer, minimum: 1 }
    InventoryReceipt:
      type: object
      required: [batch_number, quantity, unit_cost]
      properties:
        batch_number: { type: string, maxLength: 120 }
        supplier: { type: [string, 'null'], maxLength: 180 }
        purchase_date: { type: [string, 'null'], format: date }
        expiry_date: { type: [string, 'null'], format: date }
        quantity: { type: string, pattern: '^\d{1,14}(?:\.\d{1,3})?$' }
        unit_cost: { type: string, pattern: '^\d{1,14}(?:\.\d{1,4})?$' }
        reason: { type: [string, 'null'], maxLength: 1000 }
    MilkEntryWrite:
      type: object
      required: [id, slot_id, animal_id, quantity_litres]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        slot_id: { $ref: '#/components/schemas/Uuid' }
        animal_id: { $ref: '#/components/schemas/Uuid' }
        quantity_litres:
          type: string
          pattern: '^\d{1,5}(?:\.\d{1,3})?$'
        rejected_quantity_litres:
          type: string
          pattern: '^\d{1,5}(?:\.\d{1,3})?$'
          default: '0.000'
        rejection_reason: { type: [string, 'null'], maxLength: 255 }
        notes: { type: [string, 'null'], maxLength: 2000 }
        entry_source: { type: string, enum: [manual, offline], default: manual }
    MilkBulkCreate:
      type: object
      required: [production_date, session, entries]
      properties:
        production_date: { type: string, format: date }
        session: { $ref: '#/components/schemas/MilkingSession' }
        entries:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/MilkEntryWrite' }
    MilkCorrection:
      type: object
      required: [id, quantity_litres, correction_reason]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        quantity_litres:
          type: string
          pattern: '^\d{1,5}(?:\.\d{1,3})?$'
        rejected_quantity_litres:
          type: string
          pattern: '^\d{1,5}(?:\.\d{1,3})?$'
          default: '0.000'
        rejection_reason: { type: [string, 'null'], maxLength: 255 }
        notes: { type: [string, 'null'], maxLength: 2000 }
        entry_source: { type: string, enum: [manual, offline], default: manual }
        correction_reason: { type: string, minLength: 5, maxLength: 500 }
    MilkEntry:
      type: object
      required:
        - id
        - slot_id
        - organization_id
        - farm_id
        - shed_id
        - animal_id
        - production_date
        - session
        - quantity_litres
        - rejected_quantity_litres
        - sellable_quantity_litres
        - revision
        - is_current
        - created_at
        - updated_at
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        slot_id: { $ref: '#/components/schemas/Uuid' }
        organization_id: { $ref: '#/components/schemas/Uuid' }
        farm_id: { $ref: '#/components/schemas/Uuid' }
        shed_id: { $ref: '#/components/schemas/Uuid' }
        shed_name: { type: [string, 'null'] }
        animal_id: { $ref: '#/components/schemas/Uuid' }
        animal_number: { type: [string, 'null'] }
        animal_name: { type: [string, 'null'] }
        production_date: { type: string, format: date }
        session: { $ref: '#/components/schemas/MilkingSession' }
        quantity_litres: { type: string, pattern: '^\d+\.\d{3}$' }
        rejected_quantity_litres: { type: string, pattern: '^\d+\.\d{3}$' }
        sellable_quantity_litres: { type: string, pattern: '^\d+\.\d{3}$' }
        rejection_reason: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        entry_source: { type: string, enum: [manual, offline] }
        revision: { type: integer, minimum: 1 }
        is_current: { type: boolean }
        supersedes_entry_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        correction_reason: { type: [string, 'null'] }
        recorded_by:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        recorded_by_name: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        device_id: { $ref: '#/components/schemas/Uuid' }
        device_name: { type: string, maxLength: 120 }
    OwnerSignupRequest:
      type: object
      required: [name, farm_name, email, password, password_confirmation]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        farm_name: { type: string, minLength: 2, maxLength: 160 }
        email: { type: string, format: email, maxLength: 255 }
        phone_number:
          type: [string, 'null']
          minLength: 7
          maxLength: 40
          pattern: '^[0-9+(). -]+$'
        password: { type: string, format: password, minLength: 10 }
        password_confirmation: { type: string, format: password, minLength: 10 }
        timezone: { type: string, default: UTC }
        device_id: { $ref: '#/components/schemas/Uuid' }
        device_name: { type: string, maxLength: 120 }
    FamilyInviteToken:
      type: object
      required: [invitation_token]
      properties:
        invitation_token: { type: string, maxLength: 250 }
    FamilySignupRequest:
      allOf:
        - $ref: '#/components/schemas/FamilyInviteToken'
        - type: object
          required: [name, email, password, password_confirmation]
          properties:
            name: { type: string, minLength: 2, maxLength: 160 }
            email: { type: string, format: email, maxLength: 255 }
            phone_number:
              type: [string, 'null']
              minLength: 7
              maxLength: 40
              pattern: '^[0-9+(). -]+$'
            password: { type: string, format: password, minLength: 10 }
            password_confirmation: { type: string, format: password, minLength: 10 }
            device_id: { $ref: '#/components/schemas/Uuid' }
            device_name: { type: string, maxLength: 120 }
    ProfileUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        email: { type: string, format: email, maxLength: 255 }
        phone_number:
          type: [string, 'null']
          minLength: 7
          maxLength: 40
          pattern: '^[0-9+(). -]+$'
        current_password:
          type: string
          format: password
          description: Required when changing the email address.
    OrganizationPatch:
      type: object
      properties:
        name: { type: string, maxLength: 160 }
        timezone: { type: string }
        locale: { type: string, maxLength: 10 }
    FarmWrite:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, maxLength: 160 }
        code: { type: string, maxLength: 40 }
        timezone: { type: string }
    ShedWrite:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, maxLength: 160 }
        code: { type: string, maxLength: 40 }
    VersionedMutation:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
    AnimalBreedCreate:
      type: object
      required: [species_id, code, name]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        species_id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, maxLength: 40, pattern: '^[A-Z0-9][A-Z0-9-]*$' }
        name: { type: string, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        is_active: { type: boolean, default: true }
    AnimalBreedUpdate:
      type: object
      required: [version]
      properties:
        code: { type: string, maxLength: 40, pattern: '^[A-Z0-9][A-Z0-9-]*$' }
        name: { type: string, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        is_active: { type: boolean }
        version: { type: integer, minimum: 1 }
    AnimalGroupCreate:
      type: object
      required: [farm_id, code, name]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        farm_id: { $ref: '#/components/schemas/Uuid' }
        default_shed_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        code: { type: string, maxLength: 40, pattern: '^[A-Z0-9][A-Z0-9-]*$' }
        name: { type: string, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        is_active: { type: boolean, default: true }
    AnimalGroupUpdate:
      type: object
      required: [version]
      properties:
        default_shed_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        code: { type: string, maxLength: 40, pattern: '^[A-Z0-9][A-Z0-9-]*$' }
        name: { type: string, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        is_active: { type: boolean }
        version: { type: integer, minimum: 1 }
    AnimalWriteFields:
      type: object
      properties:
        animal_number: { type: string, maxLength: 40, pattern: '^[A-Z0-9][A-Z0-9._/-]*$' }
        ear_tag_number: { type: [string, 'null'], maxLength: 80 }
        rfid_number: { type: [string, 'null'], maxLength: 120 }
        name: { type: [string, 'null'], maxLength: 120 }
        registration_number: { type: [string, 'null'], maxLength: 120 }
        species_id: { $ref: '#/components/schemas/Uuid' }
        breed_id: { $ref: '#/components/schemas/Uuid' }
        sex: { $ref: '#/components/schemas/AnimalSex' }
        life_stage: { $ref: '#/components/schemas/AnimalLifeStage' }
        date_of_birth: { type: [string, 'null'], format: date }
        is_date_of_birth_estimated: { type: boolean }
        colour: { type: [string, 'null'], maxLength: 80 }
        identifying_marks: { type: [string, 'null'], maxLength: 2000 }
        mother_animal_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        father_animal_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        external_sire_reference: { type: [string, 'null'], maxLength: 160 }
        origin: { $ref: '#/components/schemas/AnimalOrigin' }
        acquisition_date: { type: [string, 'null'], format: date }
        source_description: { type: [string, 'null'], maxLength: 255 }
        notes: { type: [string, 'null'], maxLength: 5000 }
    AnimalCreate:
      allOf:
        - $ref: '#/components/schemas/AnimalWriteFields'
        - type: object
          required: [species_id, breed_id, sex, life_stage, current_farm_id, current_shed_id, origin]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            current_farm_id: { $ref: '#/components/schemas/Uuid' }
            current_shed_id: { $ref: '#/components/schemas/Uuid' }
            current_animal_group_id:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            operational_status: { $ref: '#/components/schemas/AnimalOperationalStatus' }
    AnimalUpdate:
      allOf:
        - $ref: '#/components/schemas/AnimalWriteFields'
        - $ref: '#/components/schemas/VersionedMutation'
    AnimalWeightCreate:
      type: object
      required: [farm_id, value, unit, observed_at, source]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        farm_id:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Current-farm snapshot; the server rejects a mismatch against the locked animal.
        value:
          type: string
          pattern: '^\d{1,12}(?:\.\d{1,6})?$'
          description: Positive entered decimal value; the configured normalized maximum is enforced by the server.
        unit: { $ref: '#/components/schemas/AnimalWeightUnit' }
        observed_at:
          type: string
          format: date-time
          description: Observation instant; at most five minutes ahead of server time for clock skew.
        source: { $ref: '#/components/schemas/AnimalWeightSource' }
        notes: { type: [string, 'null'], maxLength: 5000 }
    AnimalWeightCorrection:
      type: object
      required: [value, unit, correction_reason]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        value:
          type: string
          pattern: '^\d{1,12}(?:\.\d{1,6})?$'
        unit: { $ref: '#/components/schemas/AnimalWeightUnit' }
        correction_reason: { type: string, maxLength: 2000 }
        notes: { type: [string, 'null'], maxLength: 5000 }
    AnimalStatusChangeCreate:
      type: object
      required: [new_status, effective_at, reason, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        new_status: { $ref: '#/components/schemas/AnimalOperationalStatus' }
        effective_at:
          type: string
          format: date-time
          description: Effective instant at or before server time.
        reason: { type: string, maxLength: 2000 }
        version: { type: integer, minimum: 1 }
    AnimalWeight:
      type: object
      required:
        - id
        - organization_id
        - farm_id
        - animal_id
        - entered_value
        - entered_unit
        - normalized_kg
        - observed_at
        - source
        - recorded_by
        - is_superseded
        - created_at
        - updated_at
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        organization_id: { $ref: '#/components/schemas/Uuid' }
        farm_id: { $ref: '#/components/schemas/Uuid' }
        animal_id: { $ref: '#/components/schemas/Uuid' }
        entered_value: { type: string, pattern: '^\d+\.\d{6}$' }
        entered_unit: { $ref: '#/components/schemas/AnimalWeightUnit' }
        normalized_kg: { type: string, pattern: '^\d+\.\d{6}$' }
        observed_at: { type: string, format: date-time }
        source: { $ref: '#/components/schemas/AnimalWeightSource' }
        notes: { type: [string, 'null'], maxLength: 5000 }
        recorded_by: { $ref: '#/components/schemas/Uuid' }
        supersedes_weight_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        superseded_by_weight_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        correction_reason: { type: [string, 'null'], maxLength: 2000 }
        is_superseded: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AnimalStatusChange:
      type: object
      required:
        - id
        - organization_id
        - farm_id
        - animal_id
        - previous_status
        - new_status
        - effective_at
        - reason
        - changed_by
        - sequence
        - created_at
        - updated_at
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        organization_id: { $ref: '#/components/schemas/Uuid' }
        farm_id: { $ref: '#/components/schemas/Uuid' }
        animal_id: { $ref: '#/components/schemas/Uuid' }
        previous_status: { $ref: '#/components/schemas/AnimalOperationalStatus' }
        new_status: { $ref: '#/components/schemas/AnimalOperationalStatus' }
        effective_at: { type: string, format: date-time }
        reason: { type: string, maxLength: 2000 }
        changed_by: { $ref: '#/components/schemas/Uuid' }
        sequence: { type: integer, minimum: 1 }
        animal_version: { type: [integer, 'null'], minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AnimalMovementCreate:
      type: object
      required:
        - source_farm_id
        - source_shed_id
        - destination_farm_id
        - destination_shed_id
        - requested_effective_at
        - reason
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        source_farm_id: { $ref: '#/components/schemas/Uuid' }
        source_shed_id: { $ref: '#/components/schemas/Uuid' }
        source_animal_group_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        destination_farm_id: { $ref: '#/components/schemas/Uuid' }
        destination_shed_id: { $ref: '#/components/schemas/Uuid' }
        destination_animal_group_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        requested_effective_at:
          type: string
          format: date-time
          description: Requested business time, which cannot be in the future in Phase 2B.
        reason: { type: string, maxLength: 255 }
        notes: { type: [string, 'null'], maxLength: 5000 }
    AnimalMovementDecision:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
    AnimalMovementReasonDecision:
      type: object
      required: [version, reason]
      properties:
        version: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 1000 }
    AnimalMovement:
      type: object
      required:
        - id
        - organization_id
        - animal_id
        - source_farm_id
        - source_shed_id
        - destination_farm_id
        - destination_shed_id
        - requested_effective_at
        - reason
        - status
        - approval_required
        - requested_by
        - version
        - created_at
        - updated_at
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        organization_id: { $ref: '#/components/schemas/Uuid' }
        animal_id: { $ref: '#/components/schemas/Uuid' }
        source_farm_id: { $ref: '#/components/schemas/Uuid' }
        source_shed_id: { $ref: '#/components/schemas/Uuid' }
        source_animal_group_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        destination_farm_id: { $ref: '#/components/schemas/Uuid' }
        destination_shed_id: { $ref: '#/components/schemas/Uuid' }
        destination_animal_group_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        requested_effective_at: { type: string, format: date-time }
        actual_effective_at: { type: [string, 'null'], format: date-time }
        reason: { type: string, maxLength: 255 }
        notes: { type: [string, 'null'], maxLength: 5000 }
        status: { $ref: '#/components/schemas/AnimalMovementStatus' }
        approval_required: { type: boolean }
        requested_by: { $ref: '#/components/schemas/Uuid' }
        decided_by:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        decision_at: { type: [string, 'null'], format: date-time }
        rejection_reason: { type: [string, 'null'], maxLength: 1000 }
        cancellation_reason: { type: [string, 'null'], maxLength: 1000 }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta:
          type: object
          required: [request_id]
          properties:
            request_id: { $ref: '#/components/schemas/Uuid' }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, fields, details, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            fields: { type: object, additionalProperties: true }
            details: { type: object, additionalProperties: true }
            request_id: { $ref: '#/components/schemas/Uuid' }
    SyncEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [organizations, farms, sheds, animal_species, animal_breeds, animal_groups, animals, animal_movements, animal_movements_authorized, animal_weights, animal_weights_authorized, animal_status_changes, animal_status_changes_authorized, milk_entries, milk_entries_authorized, authorized_farm_ids, next_cursor]
          properties:
            organizations: { type: array, items: { type: object, additionalProperties: true } }
            farms: { type: array, items: { type: object, additionalProperties: true } }
            sheds: { type: array, items: { type: object, additionalProperties: true } }
            animal_species: { type: array, items: { type: object, additionalProperties: true } }
            animal_breeds: { type: array, items: { type: object, additionalProperties: true } }
            animal_groups: { type: array, items: { type: object, additionalProperties: true } }
            animals: { type: array, items: { type: object, additionalProperties: true } }
            animal_movements: { type: array, items: { $ref: '#/components/schemas/AnimalMovement' } }
            animal_movements_authorized: { type: boolean }
            animal_weights: { type: array, items: { $ref: '#/components/schemas/AnimalWeight' } }
            animal_weights_authorized: { type: boolean }
            animal_status_changes: { type: array, items: { $ref: '#/components/schemas/AnimalStatusChange' } }
            animal_status_changes_authorized: { type: boolean }
            milk_entries: { type: array, items: { $ref: '#/components/schemas/MilkEntry' } }
            milk_entries_authorized: { type: boolean }
            authorized_farm_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
            next_cursor: { type: string, description: Opaque versioned cursor with a replay-safe overlap watermark. }
        meta:
          type: object
          required: [request_id]
          properties:
            request_id: { $ref: '#/components/schemas/Uuid' }
  responses:
    SuccessResponse:
      description: Successful response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    SessionResponse:
      description: Authenticated session context
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    SyncResponse:
      description: Authorized reference changes and next cursor
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SyncEnvelope' }
    ErrorResponse:
      description: Stable API error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
